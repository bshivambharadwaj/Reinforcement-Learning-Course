<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
<title id="title">A frozen policy inside an inference-time planning system</title>
<desc id="desc">The task feeds a frozen proposal policy. Candidates are scored, and search allocates remaining budget to more proposals. A selected answer is checked by an independent evaluator after search. A separate later training stage may learn from accepted traces.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#87708c"/></marker></defs>
<rect width="960" height="750" rx="18" fill="#f5f1e8"/>
<path d="M18 0H942Q960 0 960 18V110H0V18Q0 0 18 0" fill="#292332"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" fill="#d9bd93" font-size="15" letter-spacing="2">RL COURSE / INFERENCE-TIME REASONING</text>
<text x="32" y="78" fill="#ffffff" font-size="29" font-weight="700">The policy proposes. Search allocates compute.</text>
<g stroke="#87708c" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M480 185V212"/><path d="M480 282V312"/><path d="M480 382V412"/>
<path d="M480 482V512"/><path d="M480 582V612"/>
<path d="M710 447H848V247H710"/>
</g>
<g stroke="#d4cbbf" stroke-width="1.5">
<rect x="250" y="132" width="460" height="53" rx="10" fill="#ffffff"/>
<rect x="250" y="212" width="460" height="70" rx="10" fill="#e8deeb"/>
<rect x="250" y="312" width="460" height="70" rx="10" fill="#ffffff"/>
<rect x="250" y="412" width="460" height="70" rx="10" fill="#f0e1c7"/>
<rect x="250" y="512" width="460" height="70" rx="10" fill="#ffffff"/>
<rect x="250" y="612" width="460" height="70" rx="10" fill="#e2e8d8"/>
</g>
<g text-anchor="middle" fill="#292332" font-size="20">
<text x="480" y="165">Task + available budget</text>
<text x="480" y="242" font-weight="700">Frozen proposal policy</text>
<text x="480" y="267" font-size="17">Sample a next step or a complete attempt</text>
<text x="480" y="342" font-weight="700">Candidates + declared scoring signal</text>
<text x="480" y="367" font-size="17">A process score is not automatically a value</text>
<text x="480" y="442" font-weight="700">Search controller</text>
<text x="480" y="467" font-size="17">Expand, retain, revisit, or stop</text>
<text x="480" y="542" font-weight="700">Selected complete answer</text>
<text x="480" y="567" font-size="17">Abstain if no complete candidate exists</text>
<text x="480" y="642" font-weight="700">Independent evaluation</text>
<text x="480" y="667" font-size="17">Correctness, valid steps, and actual cost</text>
</g>
<text x="745" y="333" fill="#655269" font-size="17">More work</text>
<text x="745" y="357" fill="#655269" font-size="17">if affordable</text>
<text x="32" y="717" fill="#655269" font-size="16">Later training can learn from accepted traces. No parameter update occurs in this inference loop.</text>
</g></svg>
