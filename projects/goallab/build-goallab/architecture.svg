<g font-size="19" font-weight="bold"><text x="48" y="111">Goal + evidence</text><text x="295" y="111">Investigation policy</text><text x="560" y="111">Costed tools</text><text x="825" y="111">Independent verification</text></g>
<g font-size="14"><text x="48" y="141">What is known?</text><text x="48" y="164">What remains uncertain?</text><text x="295" y="141">Search, inspect, or STOP?</text><text x="295" y="164">Remaining budget matters.</text><text x="560" y="141">Reveal sources + provenance</text><text x="560" y="164">Charge every branch.</text><text x="825" y="141">Correct answer + collected support</text><text x="825" y="164">No answer-key access for policy.</text></g>
